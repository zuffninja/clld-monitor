name: CLLD monitor

on:
  schedule:
    - cron: "*/5 * * * *"    # co 5 min (minimum na GitHubie) (GitHub potrafi opoznic start o kilka minut)
  workflow_dispatch: {}       # reczne uruchomienie z zakladki Actions

permissions:
  contents: write             # zapis state.json (zapamietane sygnaly)

concurrency:
  group: clld-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Check CLLD turns
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SYMBOLS: ${{ vars.SYMBOLS || 'BTC' }}
        run: python monitor.py

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "clld-bot"
            git config user.email "clld-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: update CLLD turns"
            git push
          fi
